name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.scan.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every example has a README
        run: |
          missing=0
          for dir in examples/*/; do
            [ -d "$dir" ] || continue
            if [ ! -f "${dir}README.md" ]; then
              echo "::error::${dir} has no README.md"
              missing=1
            fi
          done
          exit $missing

      - name: Check no .env is committed
        run: |
          # Only dotfiles a secret would actually live in — `.env`, `.env.local`,
          # `.env.production` — at any depth. Not every path ending in ".env":
          # a file like build.env is committed config, not a leaked secret.
          found=$(git ls-files -- '.env' '.env.*' '**/.env' '**/.env.*' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::committed .env file(s): $found"
            exit 1
          fi

      - name: Check the soroban-ci example matches the workflow it documents
        run: |
          # Two copies exist on purpose: GitHub only runs workflows from
          # .github/workflows, so the example cannot ship a live one. This step
          # is what keeps the second copy honest rather than trusting nobody
          # edits one and forgets the other.
          if ! diff -u examples/soroban-ci/workflows/contract.yml \
                      .github/workflows/soroban-contract.yml; then
            echo "::error::examples/soroban-ci/workflows/contract.yml has drifted from .github/workflows/soroban-contract.yml"
            exit 1
          fi

      - id: scan
        name: Build the node job matrix
        run: |
          node_dirs=$(find examples -mindepth 2 -maxdepth 2 -name package.json -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "node=$node_dirs" >> "$GITHUB_OUTPUT"
          echo "node: $node_dirs"

  node:
    name: build ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build --if-present
      # Examples that ship tests get them run; the ones that do not are
      # unaffected. Anything needing the network belongs in its own script,
      # not here.
      - run: npm test --if-present
