name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  discover:
    name: Discover examples
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.scan.outputs.node }}
      rust: ${{ steps.scan.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every example has a README
        run: |
          missing=0
          for dir in examples/*/; do
            [ -d "$dir" ] || continue
            if [ ! -f "${dir}README.md" ]; then
              echo "::error::${dir} has no README.md"
              missing=1
            fi
          done
          exit $missing

      - name: Check no .env is committed
        run: |
          found=$(git ls-files '*.env' '**/.env' | grep -v '\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::committed .env file(s): $found"
            exit 1
          fi

      - id: scan
        name: Build job matrices
        run: |
          node_dirs=$(find examples -mindepth 2 -maxdepth 2 -name package.json -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          rust_dirs=$(find examples -mindepth 2 -maxdepth 2 -name Cargo.toml  -exec dirname {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "node=$node_dirs" >> "$GITHUB_OUTPUT"
          echo "rust=$rust_dirs" >> "$GITHUB_OUTPUT"
          echo "node: $node_dirs"
          echo "rust: $rust_dirs"

  node:
    name: build ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build --if-present

  rust:
    name: build ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --target wasm32-unknown-unknown --release
