# The pinned build toolchain, in SEP-58 vocabulary. Single source of truth —
# build.sh, deploy.sh, verify.sh and CI all read this file.
#
# BLDIMG is recorded into the built Wasm as SEP-58 `bldimg`, so it must satisfy
# that field's format (SEP-58 v0.6.0 §1):
#
#   * Explicit registry host. "stellar/stellar-cli@sha256:…" is NOT conformant;
#     "docker.io/stellar/stellar-cli@sha256:…" is.
#   * A SINGLE-ARCH digest, not a multi-arch manifest list. A list digest
#     resolves to a different concrete image per host architecture, which is
#     exactly the ambiguity the pin exists to remove. This digest is the
#     linux/amd64 member of the 27.1.0-rust1.97.1-slim-trixie list.
#
# Because the image bundles the Rust toolchain, one digest transitively pins
# rustc, cargo, the wasm32v1-none target and the system layer beneath them.
BLDIMG="docker.io/stellar/stellar-cli@sha256:7040ab64bb977006c2b7466fc5face9a1ef317a53e494564d7d6ddb083cd032a"

# Informational only — the digest above is what actually gets pulled. Recorded
# here so a human can tell at a glance what the digest resolves to.
BLDIMG_TAG="stellar/stellar-cli:27.1.0-rust1.97.1-slim-trixie (linux/amd64)"

BUILD_PLATFORM="linux/amd64"

# SEP-58 `bldopt` entries: flags passed verbatim to `stellar contract build`,
# recorded in the Wasm so a verifier replays the identical invocation.
#
# --locked is close to mandatory: without it cargo may re-resolve dependencies
# against the registry instead of Cargo.lock, and the build stops being
# reproducible. The SEP calls this out explicitly.
BLDOPT=(--locked)

# The source archive. SEP-58 requires the archive to contain exactly one
# top-level directory, which the verifier mounts at /source.
SOURCE_PREFIX="reproducible-counter-0.1.0"
SOURCE_ARCHIVE="sources/reproducible-counter-0.1.0.tar"

CONTRACT_PACKAGE="reproducible-counter"
WASM_NAME="reproducible_counter.wasm"
